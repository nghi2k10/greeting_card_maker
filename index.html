<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tạo Thiệp & Meme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Cột bên trái: Bảng điều khiển -->
        <aside class="sidebar">
            <h2>Công cụ Tùy chỉnh</h2>
            
            <div class="control-group">
                <label for="imageUpload">1. Tải ảnh nền (Phôi thiệp/Meme):</label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>

            <!-- Thêm khu vực Thư viện mẫu -->
            <div class="control-group">
                <label>Thư viện phôi ảnh có sẵn:</label>
                <div class="template-gallery">
                    <!-- Ảnh 1: Meme mèo -->
                    <img src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=400&h=400&fit=crop" alt="Meme mèo" class="template-img" crossorigin="anonymous">
                    
                    <!-- Ảnh 2: Phôi thiệp 20-11 (Minh họa bằng ảnh hoa) -->
                    <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400&h=400&fit=crop" alt="Thiệp 20-11" class="template-img" crossorigin="anonymous">
                    
                    <img src="https://res.cloudinary.com/dzcqjjkf7/image/upload/v1785469765/C%E1%BB%99ng_L%C3%BD_e3esxj.jpg" alt="Meme1" class="template-img" crossorigin="anonymous">

                    <img src="https://res.cloudinary.com/dzcqjjkf7/image/upload/v1785469864/Ch%E1%BB%8B_Phi%E1%BA%BFn_t8twpy.png" alt="Meme2" class="template-img" crossorigin="anonymous">
                </div>
            </div>

            <!-- Cụm công cụ Phụ kiện (Stickers) -->
            <div class="control-group">
                <label>4. Thêm phụ kiện trang trí:</label>
                <div class="sticker-gallery">
                    <!-- Chủ đề Trang trí -->
                    <img src="https://img.icons8.com/color/96/ribbon.png" alt="Nơ đỏ" class="sticker-btn" crossorigin="anonymous">
                    <img src="https://img.icons8.com/color/96/flower.png" alt="Bông hoa" class="sticker-btn" crossorigin="anonymous">
                    <img src="https://img.icons8.com/color/96/gift.png" alt="Hộp quà" class="sticker-btn" crossorigin="anonymous">
                    
                    <!-- Chủ đề Thú cưng -->
                    <img src="https://img.icons8.com/color/96/cat-profile.png" alt="Mặt mèo" class="sticker-btn" crossorigin="anonymous">
                    <img src="https://img.icons8.com/color/96/cat-footprint.png" alt="Dấu chân mèo" class="sticker-btn" crossorigin="anonymous">
                    
                    <!-- Chủ đề Vui nhộn / Meme -->
                    <img src="https://img.icons8.com/color/96/sunglasses.png" alt="Kính ngầu" class="sticker-btn" crossorigin="anonymous">
                    <img src="https://img.icons8.com/color/96/pixel-heart.png" alt="Trái tim pixel" class="sticker-btn" crossorigin="anonymous">
                    <img src="https://img.icons8.com/color/96/musical-notes.png" alt="Nốt nhạc" class="sticker-btn" crossorigin="anonymous">
                </div>
            </div>

            <div class="control-group">
                <label>5. Ghép kiểu tóc:</label>
                <div class="sticker-gallery">
                    <!-- Tóc tỉa Layer -->
                    <img src="https://img.icons8.com/color/96/womens-hair.png" alt="Tóc tỉa Layer" class="sticker-btn" crossorigin="anonymous">
                    <!-- Tóc Mullet -->
                    <img src="https://img.icons8.com/color/96/man-hair.png" alt="Tóc Mullet" class="sticker-btn" crossorigin="anonymous">
                    <!-- Tóc ngắn -->
                    <img src="https://img.icons8.com/color/96/short-hair.png" alt="Tóc ngắn" class="sticker-btn" crossorigin="anonymous">
                </div>
            </div>
            
            <div class="control-group">
                <label for="textInput">2. Nhập nội dung chữ:</label>
                <input type="text" id="textInput" value="YOUR NAME" placeholder="Nhập nội dung vào đây...">
            </div>

            <!-- Thêm bộ chọn Font chữ -->
            <div class="control-group">
                <label for="fontFamily">Font chữ:</label>
                <select id="fontFamily">
                    <option value="Impact, sans-serif" selected>Impact (Kiểu Meme)</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="'Courier New', monospace">Courier New</option>
                    <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
                    <option value="'Segoe UI', sans-serif">Segoe UI</option>
                </select>
            </div>

            <div class="control-group row">
                <div class="half">
                    <label for="textColor">Màu chữ:</label>
                    <input type="color" id="textColor" value="#ffffff">
                </div>
                <div class="half">
                    <label for="fontSize">Kích thước (px):</label>
                    <!-- Tăng giới hạn max lên 2000 để dùng cho ảnh chất lượng cao -->
                    <input type="number" id="fontSize" value="60" min="10" max="2000" step="10">
                </div>
            </div>

            <!-- Thêm cụm công cụ chỉnh Viền chữ -->
            <div class="control-group row">
                <div class="half">
                    <label for="strokeColor">Màu viền:</label>
                    <input type="color" id="strokeColor" value="#000000"> <!-- Mặc định viền đen -->
                </div>
                <div class="half">
                    <label for="strokeWidth">Độ dày viền:</label>
                    <input type="number" id="strokeWidth" value="4" min="0" max="30">
                </div>
            </div>

            <div class="control-group">
                <label>3. Hướng chữ:</label>
                <div class="radio-group">
                    <label><input type="radio" name="textDirection" value="horizontal" checked> Nằm ngang</label>
                    <label><input type="radio" name="textDirection" value="vertical"> Nằm dọc</label>
                </div>
            </div>

            <button id="downloadBtn" class="primary-btn">Tải xuống tác phẩm</button>

            <button id="recordBtn" class="primary-btn" style="background-color: #e74c3c; margin-top: 10px;">
                🎥 Xuất Video (Chuyển động 3s)
            </button>
        </aside>

        <!-- Cột bên phải: Khu vực hiển thị -->
        <main class="preview-area">
            <div class="canvas-wrapper">
                <!-- Canvas là nơi vẽ ảnh và chữ bằng JavaScript -->
                <canvas id="memeCanvas" width="800" height="600"></canvas>
                <p class="hint">Bản xem trước (Kéo thả để di chuyển chữ)</p>
            </div>
        </main>
    </div>
</body>
<script src="script.js"></script>
</html>
